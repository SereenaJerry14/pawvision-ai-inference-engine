<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 620" width="100%" height="100%">
  <defs>
    <linearGradient id="nnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="conv1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="conv2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="conv3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="conv4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="poolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="fcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <marker id="nnArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1320" height="620" rx="18" fill="url(#nnBg)"/>

  <!-- Title -->
  <text x="660" y="44" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700">
    BasicCNN — Neural Network Architecture Diagram
  </text>
  <text x="660" y="70" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">
    4-Stage Feature Extractor (Conv2d + ReLU + BatchNorm2d + MaxPool2d) → AdaptiveAvgPool2d → Fully Connected Classifier
  </text>

  <!-- Section Backing Panels -->
  <rect x="165" y="95" width="705" height="420" rx="16" fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-opacity="0.4" stroke-dasharray="6,6"/>
  <text x="517" y="120" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">
    CONVOLUTIONAL FEATURE EXTRACTOR (4 BLOCKS)
  </text>

  <rect x="890" y="95" width="400" height="420" rx="16" fill="#1e293b" fill-opacity="0.4" stroke="#f97316" stroke-opacity="0.35" stroke-dasharray="6,6"/>
  <text x="1090" y="120" text-anchor="middle" fill="#fdba74" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">
    CLASSIFIER HEAD (self.classifier)
  </text>

  <!-- ================= INPUT IMAGE ================= -->
  <g transform="translate(30, 195)">
    <rect x="0" y="0" width="95" height="190" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="10" y="15" width="75" height="75" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="47" y="62" text-anchor="middle" font-size="34">🐱</text>
    <text x="47" y="115" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Input RGB</text>
    <text x="47" y="135" text-anchor="middle" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5" font-weight="700">3 × 224 × 224</text>
    <text x="47" y="156" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">ImageNet Norm</text>
    <text x="47" y="172" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">Augmentations</text>
  </g>

  <line x1="125" y1="290" x2="180" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#nnArrow)"/>

  <!-- ================= CONV BLOCK 1 ================= -->
  <g transform="translate(188, 165)">
    <!-- 3D Feature Map Stack -->
    <rect x="12" y="-8" width="110" height="235" rx="8" fill="url(#conv1)" opacity="0.35"/>
    <rect x="6" y="-4" width="110" height="235" rx="8" fill="url(#conv1)" opacity="0.6"/>
    <rect x="0" y="0" width="110" height="235" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>

    <rect x="8" y="10" width="94" height="26" rx="5" fill="url(#conv1)"/>
    <text x="55" y="27" text-anchor="middle" fill="#090d16" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">Conv Block 1</text>

    <text x="55" y="58" text-anchor="middle" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">Conv2d(3, 64)</text>
    <text x="55" y="75" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10.5">kernel=3, pad=1</text>
    <text x="55" y="100" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">ReLU()</text>
    <text x="55" y="122" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="10.5">BatchNorm2d(64)</text>
    <text x="55" y="146" text-anchor="middle" fill="#f472b6" font-family="Consolas, monospace" font-size="11" font-weight="600">MaxPool2d(2×2)</text>

    <line x1="14" y1="165" x2="96" y2="165" stroke="#334155" stroke-width="1"/>
    <text x="55" y="186" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">Output Tensor</text>
    <text x="55" y="206" text-anchor="middle" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5" font-weight="700">64 × 112 × 112</text>
  </g>

  <line x1="312" y1="290" x2="352" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#nnArrow)"/>

  <!-- ================= CONV BLOCK 2 ================= -->
  <g transform="translate(360, 175)">
    <rect x="14" y="-8" width="115" height="215" rx="8" fill="url(#conv2)" opacity="0.35"/>
    <rect x="7" y="-4" width="115" height="215" rx="8" fill="url(#conv2)" opacity="0.6"/>
    <rect x="0" y="0" width="115" height="215" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>

    <rect x="8" y="10" width="99" height="26" rx="5" fill="url(#conv2)"/>
    <text x="57" y="27" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">Conv Block 2</text>

    <text x="57" y="56" text-anchor="middle" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">Conv2d(64, 128)</text>
    <text x="57" y="73" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10.5">kernel=3, pad=1</text>
    <text x="57" y="96" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">ReLU()</text>
    <text x="57" y="118" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="10.5">BatchNorm2d(128)</text>
    <text x="57" y="140" text-anchor="middle" fill="#f472b6" font-family="Consolas, monospace" font-size="11" font-weight="600">MaxPool2d(2×2)</text>

    <line x1="14" y1="156" x2="101" y2="156" stroke="#334155" stroke-width="1"/>
    <text x="57" y="175" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">Output Tensor</text>
    <text x="57" y="194" text-anchor="middle" fill="#60a5fa" font-family="Consolas, monospace" font-size="11.5" font-weight="700">128 × 56 × 56</text>
  </g>

  <line x1="490" y1="290" x2="530" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#nnArrow)"/>

  <!-- ================= CONV BLOCK 3 ================= -->
  <g transform="translate(538, 185)">
    <rect x="16" y="-8" width="120" height="195" rx="8" fill="url(#conv3)" opacity="0.35"/>
    <rect x="8" y="-4" width="120" height="195" rx="8" fill="url(#conv3)" opacity="0.6"/>
    <rect x="0" y="0" width="120" height="195" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>

    <rect x="8" y="10" width="104" height="26" rx="5" fill="url(#conv3)"/>
    <text x="60" y="27" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">Conv Block 3</text>

    <text x="60" y="54" text-anchor="middle" fill="#e2e8f0" font-family="Consolas, monospace" font-size="10.5">Conv2d(128, 256)</text>
    <text x="60" y="70" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">kernel=3, pad=1</text>
    <text x="60" y="90" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">ReLU()</text>
    <text x="60" y="110" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="10.5">BatchNorm2d(256)</text>
    <text x="60" y="130" text-anchor="middle" fill="#f472b6" font-family="Consolas, monospace" font-size="11" font-weight="600">MaxPool2d(2×2)</text>

    <line x1="14" y1="144" x2="106" y2="144" stroke="#334155" stroke-width="1"/>
    <text x="60" y="162" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">Output Tensor</text>
    <text x="60" y="180" text-anchor="middle" fill="#818cf8" font-family="Consolas, monospace" font-size="11.5" font-weight="700">256 × 28 × 28</text>
  </g>

  <line x1="675" y1="290" x2="712" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#nnArrow)"/>

  <!-- ================= CONV BLOCK 4 ================= -->
  <g transform="translate(720, 195)">
    <rect x="18" y="-8" width="122" height="175" rx="8" fill="url(#conv4)" opacity="0.35"/>
    <rect x="9" y="-4" width="122" height="175" rx="8" fill="url(#conv4)" opacity="0.6"/>
    <rect x="0" y="0" width="122" height="175" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>

    <rect x="8" y="10" width="106" height="26" rx="5" fill="url(#conv4)"/>
    <text x="61" y="27" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">Conv Block 4</text>

    <text x="61" y="52" text-anchor="middle" fill="#e2e8f0" font-family="Consolas, monospace" font-size="10.5">Conv2d(256, 512)</text>
    <text x="61" y="68" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">kernel=3, pad=1</text>
    <text x="61" y="86" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600">ReLU + BatchNorm</text>
    <text x="61" y="106" text-anchor="middle" fill="#f472b6" font-family="Consolas, monospace" font-size="11" font-weight="600">MaxPool2d(2×2)</text>

    <line x1="14" y1="122" x2="108" y2="122" stroke="#334155" stroke-width="1"/>
    <text x="61" y="140" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">Output Tensor</text>
    <text x="61" y="158" text-anchor="middle" fill="#c084fc" font-family="Consolas, monospace" font-size="11.5" font-weight="700">512 × 14 × 14</text>
  </g>

  <line x1="860" y1="290" x2="902" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#nnArrow)"/>

  <!-- ================= ADAPTIVE POOL & FLATTEN ================= -->
  <g transform="translate(910, 185)">
    <rect x="0" y="0" width="110" height="200" rx="10" fill="#0f172a" stroke="#f472b6" stroke-width="2"/>
    <rect x="8" y="10" width="94" height="26" rx="5" fill="url(#poolGrad)"/>
    <text x="55" y="27" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">Pool &amp; Flatten</text>

    <text x="55" y="60" text-anchor="middle" fill="#f9a8d4" font-family="Consolas, monospace" font-size="10.5" font-weight="600">AdaptiveAvgPool</text>
    <text x="55" y="78" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="10.5">output: (1, 1)</text>
    <text x="55" y="98" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">512 × 1 × 1</text>

    <line x1="16" y1="115" x2="94" y2="115" stroke="#334155" stroke-width="1"/>
    <text x="55" y="138" text-anchor="middle" fill="#f472b6" font-family="Consolas, monospace" font-size="11" font-weight="700">nn.Flatten()</text>
    <text x="55" y="160" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">1D Feature Vector</text>
    <text x="55" y="180" text-anchor="middle" fill="#f8fafc" font-family="Consolas, monospace" font-size="12" font-weight="700">512 units</text>
  </g>

  <line x1="1020" y1="290" x2="1055" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#nnArrow)"/>

  <!-- ================= DENSE HIDDEN LAYER ================= -->
  <g transform="translate(1062, 185)">
    <rect x="0" y="0" width="105" height="200" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="2"/>
    <rect x="8" y="10" width="89" height="26" rx="5" fill="url(#fcGrad)"/>
    <text x="52" y="27" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">Dense + Drop</text>

    <text x="52" y="64" text-anchor="middle" fill="#fed7aa" font-family="Consolas, monospace" font-size="10.5" font-weight="600">Linear(512,256)</text>
    <text x="52" y="90" text-anchor="middle" fill="#fdba74" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">ReLU()</text>
    <text x="52" y="116" text-anchor="middle" fill="#fca5a5" font-family="Consolas, monospace" font-size="10.5" font-weight="600">Dropout(p=0.5)</text>

    <line x1="14" y1="138" x2="91" y2="138" stroke="#334155" stroke-width="1"/>
    <text x="52" y="160" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">Hidden Vector</text>
    <text x="52" y="180" text-anchor="middle" fill="#fb923c" font-family="Consolas, monospace" font-size="12" font-weight="700">256 units</text>
  </g>

  <line x1="1167" y1="290" x2="1198" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#nnArrow)"/>

  <!-- ================= OUTPUT LAYER ================= -->
  <g transform="translate(1205, 185)">
    <rect x="0" y="0" width="75" height="200" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <rect x="6" y="10" width="63" height="26" rx="5" fill="url(#outGrad)"/>
    <text x="37" y="27" text-anchor="middle" fill="#090d16" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">Output</text>

    <text x="37" y="56" text-anchor="middle" fill="#a7f3d0" font-family="Consolas, monospace" font-size="9.5">Linear(256,2)</text>

    <!-- Class 0: Cat Node -->
    <circle cx="37" cy="96" r="18" fill="#f43f5e" fill-opacity="0.25" stroke="#f43f5e" stroke-width="2"/>
    <text x="37" y="101" text-anchor="middle" fill="#fda4af" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">Cat</text>

    <!-- Class 1: Dog Node -->
    <circle cx="37" cy="146" r="18" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2"/>
    <text x="37" y="151" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">Dog</text>

    <text x="37" y="184" text-anchor="middle" fill="#34d399" font-family="Consolas, monospace" font-size="10.5" font-weight="700">2 Classes</text>
  </g>

  <!-- Bottom Summary Legend Bar -->
  <rect x="165" y="535" width="1125" height="54" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="727" y="558" text-anchor="middle" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12" font-weight="600">
    Tensor Flow:  [B, 3, 224, 224]  →  [B, 64, 112, 112]  →  [B, 128, 56, 56]  →  [B, 256, 28, 28]  →  [B, 512, 14, 14]  →  [B, 512, 1, 1]  →  [B, 512]  →  [B, 256]  →  [B, 2]
  </text>
  <text x="727" y="578" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">
    Training Loss: nn.CrossEntropyLoss()   •   Inference Activation: torch.softmax(logits, dim=1)   •   Total Parameters: ~1.68M
  </text>
</svg>

