  </text>

  <!-- Config Bar at Top Right -->
  <rect x="925" y="100" width="235" height="250" rx="16" fill="#1e293b" fill-opacity="0.7" stroke="#64748b" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="941" y="116" width="203" height="34" rx="8" fill="#334155"/>
  <text x="1042" y="138" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">
    ⚙️ CONFIGURATION &amp; CLI
  </text>
  <text x="1042" y="168" text-anchor="middle" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5">
    config.py &amp; main.py
  </text>
  <text x="1042" y="196" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11.5">
    • Centralized Hyperparameters
  </text>
  <text x="1042" y="218" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11.5">
    • Seed: 42 (Reproducible)
  </text>
  <text x="1042" y="240" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11.5">
    • Auto CUDA / CPU Detection
  </text>
  <text x="1042" y="262" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11.5">
    • Modular CLI Entrypoints:
  </text>
  <text x="1042" y="284" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">
