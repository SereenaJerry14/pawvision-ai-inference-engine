  </text>
  <text x="1036" y="534" text-anchor="middle" fill="#f9a8d4" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="600">
    • 🐱 Cat vs 🐶 Dog Theme
  </text>
  <text x="1036" y="556" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11.5">
