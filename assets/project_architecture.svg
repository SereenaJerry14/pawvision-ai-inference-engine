  </text>
  <text x="1042" y="302" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">
    python train.py / predict.py
  </text>
  <text x="1042" y="320" text-anchor="middle" fill="#fdba74" font-family="Consolas, monospace" font-size="11">
    python app.py (Port 8000)
  </text>
</svg>

